global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: devplanner

scrape_configs:
  - job_name: devplanner-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: [api:3001]
        labels:
          service: devplanner-api

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          service: devplanner-host
