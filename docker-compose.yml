services:
  devplanner-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devplanner
      POSTGRES_USER: devplanner
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devplanner}
    volumes:
      - devplanner_db_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devplanner -d devplanner"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  devplanner-redis:
    image: redis:7-alpine
    volumes:
      - devplanner_redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  radicale:
    image: tomsquest/docker-radicale:latest
    volumes:
      - radicale_data:/data
    ports:
      - "${RADICALE_PORT:-5232}:5232"
    restart: unless-stopped
    # Image ships a ~30s curl healthcheck → noisy INFO logs. Nothing in this compose waits on Radicale health.
    healthcheck:
      disable: true

  # --- App (default `docker compose up -d` starts db, redis, radicale, api, web, worker)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./data/reviews:/app/reviews
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DATABASE_URL: postgresql://devplanner:${DB_PASSWORD:-devplanner}@devplanner-db:5432/devplanner
      REDIS_URL: redis://devplanner-redis:6379
    labels:
      crowdsec.enable: "true"
      crowdsec.labels.type: devplanner
    depends_on:
      devplanner-db:
        condition: service_healthy
      devplanner-redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Auth is Clerk — API requests carry a Bearer token, so no cross-subdomain
  # cookie config is needed. NEXT_PUBLIC_* values are baked at image build.
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/login}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/login}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/now}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/now}
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      DATABASE_URL: postgresql://devplanner:${DB_PASSWORD:-devplanner}@devplanner-db:5432/devplanner
    depends_on:
      devplanner-db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DEVPLANNER_PROCESS: worker
      DATABASE_URL: postgresql://devplanner:${DB_PASSWORD:-devplanner}@devplanner-db:5432/devplanner
      REDIS_URL: redis://devplanner-redis:6379
    depends_on:
      devplanner-db:
        condition: service_healthy
      devplanner-redis:
        condition: service_started
      api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  # Optional: one-off schema push from the host repo (no image rebuild). Usually unnecessary — the API container runs push on start.
  # docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    image: node:20-bookworm-slim
    working_dir: /src
    volumes:
      - .:/src
    environment:
      DATABASE_URL: postgresql://devplanner:${DB_PASSWORD:-devplanner}@devplanner-db:5432/devplanner
    command: ["sh", "-c", "npm ci && npm run db:migrate -w @devplanner/api"]
    depends_on:
      devplanner-db:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.4
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.2
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      node-exporter:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/user)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    ports:
      - "${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${CROWDSEC_PORT:-8081}:8080"
    environment:
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/nginx crowdsecurity/sshd"
    volumes:
      - crowdsec-data:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/parsers/devplanner-pino.yaml:/etc/crowdsec/parsers/s01-parse/devplanner-pino.yaml:ro
      - ./crowdsec/scenarios/devplanner-http-auth-bf.yaml:/etc/crowdsec/scenarios/devplanner-http-auth-bf.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devplanner_db_data:
  devplanner_redis_data:
  radicale_data:
  loki-data:
  prometheus-data:
  alloy-data:
  crowdsec-data:
  crowdsec-db:
